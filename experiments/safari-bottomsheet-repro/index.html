<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Safari BottomSheet Repro</title>
    <style>
      :root { color: #3f353a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #eee9ef; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; overflow-x: hidden; }
      body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 18% 12%, rgba(221,184,192,.72), transparent 34%), radial-gradient(circle at 78% 72%, rgba(207,196,216,.7), transparent 38%), #eee9ef; }
      main { padding: 28px 18px 120px; max-width: 520px; margin: auto; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 13px; line-height: 1.55; color: #796c72; }
      .card { margin-top: 14px; padding: 16px; border: 1px solid rgba(255,255,255,.58); border-radius: 18px; background: rgba(255,255,255,.3); box-shadow: 0 10px 30px rgba(71,54,62,.07); }
      .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      button { min-height: 42px; padding: 8px 12px; border: 1px solid rgba(255,255,255,.65); border-radius: 12px; color: #4b3e44; background: rgba(255,255,255,.48); font: inherit; }
      button[aria-pressed="true"] { background: #c98b9e; color: white; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      .actions button { flex: 1; }
      #log { min-height: 96px; max-height: 180px; overflow: auto; white-space: pre-wrap; font: 11px/1.45 ui-monospace, monospace; }
      #inline-host { position: relative; min-height: 1px; }
      .repro-layer { inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; }
      .repro-layer.fixed { position: fixed; }
      .repro-layer.absolute { position: absolute; min-height: 100dvh; }
      .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.2); }
      .sheet { position: relative; width: 100%; min-height: 58dvh; padding: 14px 18px calc(24px + env(safe-area-inset-bottom)); border: 1px solid rgba(255,255,255,.58); border-radius: 24px 24px 0 0; background: linear-gradient(145deg, rgba(255,255,255,.42), rgba(255,255,255,.19)); box-shadow: 0 10px 30px rgba(71,54,62,.085), inset 0 1px 0 rgba(255,255,255,.58); }
      .with-blur .sheet { backdrop-filter: blur(12px) saturate(145%); -webkit-backdrop-filter: blur(12px) saturate(145%); }
      .with-animation .scrim { animation: fade-in .3s ease both; }
      .with-animation .sheet { animation: slide-up .35s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .handle { width: 40px; height: 4px; border-radius: 99px; background: rgba(80,65,72,.25); margin: 0 auto 18px; }
      label { display: block; margin-bottom: 6px; font-size: 13px; }
      .sheet input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid rgba(255,255,255,.48); border-radius: 12px; background: rgba(255,255,255,.34); color: #3f353a; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Safari BottomSheet Repro</h1>
      <p>一次只切换一个变量。建议先测全部开启，再依次关闭 Animation 与 Backdrop filter。</p>
      <div class="card toggles" id="toggles"></div>
      <div class="actions"><button id="open">打开</button><button id="close">关闭</button><button id="repeat">快速开关 ×5</button></div>
      <div class="card"><strong>事件记录</strong><div id="log"></div></div>
      <div class="card">底页内容 A<br />用于观察 scrim 穿透、残帧与合成重叠。</div>
      <div class="card">底页内容 B<br />打开键盘后观察中央区域。</div>
      <div id="inline-host"></div>
    </main>
    <template id="sheet-template">
      <div class="repro-layer" role="dialog" aria-modal="true">
        <div class="scrim"></div>
        <section class="sheet">
          <div class="handle"></div>
          <label for="repro-input">唯一输入框（唤起键盘）</label>
          <input id="repro-input" autocomplete="off" placeholder="点击或自动聚焦" />
        </section>
      </div>
    </template>
    <script>
      const settings = { portal: true, fixed: true, animation: true, backdropFilter: true, autoFocus: true, visualViewport: true };
      const labels = { portal: 'Portal → body', fixed: 'Fixed layer', animation: 'Transform animation', backdropFilter: 'Backdrop filter', autoFocus: 'Keyboard focus', visualViewport: 'Observe visualViewport' };
      const toggles = document.querySelector('#toggles');
      const logNode = document.querySelector('#log');
      let layer = null;
      let repeatTimer = null;
      function log(message) { const viewport = window.visualViewport; const metrics = viewport ? ` h=${Math.round(viewport.height)} y=${Math.round(viewport.offsetTop)}` : ''; logNode.textContent = `${new Date().toISOString().slice(11, 23)} ${message}${metrics}\n${logNode.textContent}`; }
      function renderToggles() { toggles.replaceChildren(...Object.keys(settings).map((key) => { const button = document.createElement('button'); button.textContent = labels[key]; button.setAttribute('aria-pressed', String(settings[key])); button.onclick = () => { settings[key] = !settings[key]; renderToggles(); log(`${key}=${settings[key]}`); }; return button; })); }
      function closeSheet() { if (!layer) return; layer.remove(); layer = null; log('unmount'); }
      function openSheet() { closeSheet(); layer = document.querySelector('#sheet-template').content.firstElementChild.cloneNode(true); layer.classList.add(settings.fixed ? 'fixed' : 'absolute'); if (settings.animation) layer.classList.add('with-animation'); if (settings.backdropFilter) layer.classList.add('with-blur'); layer.querySelector('.scrim').onclick = closeSheet; (settings.portal ? document.body : document.querySelector('#inline-host')).append(layer); log(`mount portal=${settings.portal} fixed=${settings.fixed} animation=${settings.animation} blur=${settings.backdropFilter}`); if (settings.autoFocus) requestAnimationFrame(() => layer?.querySelector('input').focus()); }
      function repeat() { clearInterval(repeatTimer); let step = 0; repeatTimer = setInterval(() => { step % 2 === 0 ? openSheet() : closeSheet(); step += 1; if (step >= 10) clearInterval(repeatTimer); }, 180); }
      renderToggles();
      document.querySelector('#open').onclick = openSheet;
      document.querySelector('#close').onclick = closeSheet;
      document.querySelector('#repeat').onclick = repeat;
      if (window.visualViewport) ['resize', 'scroll'].forEach((eventName) => window.visualViewport.addEventListener(eventName, () => { if (settings.visualViewport) log(`visualViewport:${eventName}`); }));
      log('ready');
    </script>
  </body>
</html>
